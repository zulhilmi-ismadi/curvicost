[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "curvicost"
version = "0.2.1"
description = "Score curvilinear segmentations against the functional cost of their errors, not just overlap."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Mohd-Zulhilmi Ismadi" }]
keywords = [
  "segmentation", "evaluation", "metrics", "vasculature", "neurite",
  "curvilinear", "connectivity", "skeleton", "expected run length",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-image>=0.22",
  "networkx>=3.0",
]

[project.optional-dependencies]
io = ["tifffile>=2023.1.1", "nibabel>=5.0", "pillow>=9.0"]
test = ["pytest>=7.0"]
all = ["curvicost[io,test]"]

[project.scripts]
curvicost = "curvicost.cli:main"

[project.urls]
Homepage = "https://github.com/zulhilmi-ismadi/curvicost"
Source = "https://github.com/zulhilmi-ismadi/curvicost"
Issues = "https://github.com/zulhilmi-ismadi/curvicost/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/curvicost"]

[tool.pytest.ini_options]
testpaths = ["tests"]
