name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install ".[all]"
      - name: Test
        # The study-tree tests (drift against code/p16, reproduction of the
        # recorded parquet) skip themselves here; they only run inside the
        # study repository.
        run: python -m pytest -q
      - name: Package builds and the CLI answers
        run: |
          python -m pip install build
          python -m build
          curvicost --version
